name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apiuser
          POSTGRES_PASSWORD: apipassword
          POSTGRES_DB: api_starter
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U apiuser -d api_starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate dev
        env:
          DATABASE_URL: "postgresql://apiuser:apipassword@localhost:5432/api_starter?schema=public"
          NODE_ENV: test
          PORT: 3000
          JWT_SECRET: test-secret-key
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: test-refresh-secret
          JWT_REFRESH_EXPIRES_IN: 7d

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://apiuser:apipassword@localhost:5432/api_starter?schema=public"
          NODE_ENV: test
          PORT: 3000
          JWT_SECRET: test-secret-key
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: test-refresh-secret
          JWT_REFRESH_EXPIRES_IN: 7d